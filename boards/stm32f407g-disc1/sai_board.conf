# boards/stm32f407g-disc1/sai_board.conf
# Board defaults for STM32F407-Discovery (merged under the user's config)

CONFIG_SAI_ARCH="arm"
CONFIG_SAI_CPU="cortex-m4"
CONFIG_SAI_SOC="stm32f407xx"

CONFIG_SAI_CPU_CLOCK_HZ=168000000
CONFIG_SAI_IDLE_STACK_SIZE=512
CONFIG_SAI_MAIN_STACK_SIZE=2048
CONFIG_SAI_HEAP_SIZE=65536
CONFIG_SAI_TICK_MS=1

CONFIG_SAI_TICKLESS=y
CONFIG_SAI_STACK_SENTINEL=y
CONFIG_SAI_THREAD_STATS=y
CONFIG_SAI_ASSERT=y
CONFIG_SAI_LOG_LEVEL=3
