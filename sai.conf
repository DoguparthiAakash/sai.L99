# sai.conf — user configuration overrides (host build defaults shown).
# Copy values from cmake/sai_defaults.txt and change them here.

CONFIG_SAI_TICK_MS=1
CONFIG_SAI_TIMESLICE=10
CONFIG_SAI_MAIN_STACK_SIZE=4096
CONFIG_SAI_IDLE_STACK_SIZE=4096
CONFIG_SAI_HEAP_SIZE=262144
CONFIG_SAI_THREAD_STATS=y
CONFIG_SAI_STACK_SENTINEL=y
CONFIG_SAI_ASSERT=y
CONFIG_SAI_LOG=y
CONFIG_SAI_LOG_LEVEL=4
CONFIG_SAI_DYNAMIC_IPC=y
CONFIG_SAI_TICKLESS=y
